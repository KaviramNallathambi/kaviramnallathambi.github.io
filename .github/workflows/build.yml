name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AF614F: ${{ secrets.AF614F }}
          B62B98: ${{ secrets.B62B98 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AF614F', '')
          sec_b = os.environ.get('B62B98', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- c81470a11754f9b325420a83c09a524f67bf59 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 65cda1679a1b908b9e2b3979b415ec7f81d481c2 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
